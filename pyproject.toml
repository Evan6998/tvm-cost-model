[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvm-cost-model"
version = "0.1.0"
description = "Research scaffolding for a transferable GPU kernel cost model"
authors = [{name = "Project Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pyarrow==20.0",
    "pyarrow-stubs==20.0.0.20251107",
    "torch>=2.3",
    "numpy>=1.26",
    "pydantic>=2.12.5",
    "tqdm>=4.67",
    "xgboost>=2.0",
    "scikit-learn>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
